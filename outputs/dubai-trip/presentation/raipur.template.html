<style>
@font-face{font-family:'Sora';src:url(data:font/woff2;base64,{{SORA}}) format('woff2');font-weight:100 900;font-display:block}
@font-face{font-family:'DM Sans';src:url(data:font/woff2;base64,{{DMSANS}}) format('woff2');font-weight:100 900;font-display:block}
:root{
  --font-h:'Sora',system-ui,sans-serif;--font-b:'DM Sans',system-ui,sans-serif;
  --font-hi:'Kohinoor Devanagari','Noto Sans Devanagari','Mangal','Nirmala UI',sans-serif;
  --bg:#0a0612;--ink:#fff8f0;--dim:rgba(255,244,230,.72);
  --saffron:#ff9f1c;--orange:#ff6a00;--magenta:#ff2e88;--violet:#7c3aed;
  --ease:cubic-bezier(.7,0,.2,1);--spring:cubic-bezier(.2,.9,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
ul,ol{list-style:none}
a{color:inherit;text-decoration:none}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font-b);-webkit-font-smoothing:antialiased;font-size:16px}

/* ---------- background: three drifting colour fields, grain and a dot grid ---------- */
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;width:85vmax;height:85vmax;margin:-42.5vmax 0 0 -42.5vmax;border-radius:50%;opacity:.5;transition:left 2.6s var(--ease),top 2.6s var(--ease)}
.blob i{position:absolute;inset:0;border-radius:50%;animation:drift 18s ease-in-out infinite alternate}
.b1 i{background:radial-gradient(circle,rgba(255,122,0,.9),rgba(255,122,0,0) 62%)}
.b2 i{background:radial-gradient(circle,rgba(255,46,136,.85),rgba(255,46,136,0) 62%);animation-duration:22s;animation-delay:-6s}
.b3 i{background:radial-gradient(circle,rgba(124,58,237,.95),rgba(124,58,237,0) 62%);animation-duration:26s;animation-delay:-12s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(4vmax,-3vmax) scale(1.08)}100%{transform:translate(-3vmax,3vmax) scale(.95)}}
#bg::before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.4px) 0 0/26px 26px;mask:radial-gradient(ellipse at center,#000 30%,transparent 80%)}
#bg::after{content:"";position:absolute;inset:0;opacity:.09;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.vign{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(5,2,10,.75))}

/* ---------- the board: a fixed 1600x900 canvas scaled to the screen ---------- */
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;transform:translate(-50%,-50%) scale(var(--s,1))}
.bx{position:absolute;border-radius:26px;overflow:hidden;isolation:isolate;
  box-shadow:0 24px 60px -18px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.14);
  transition:left .95s var(--ease),top .95s var(--ease),width .95s var(--ease),height .95s var(--ease),opacity .6s ease,transform .9s var(--spring);
  transition-delay:var(--dl,0s)}
.bx.off{opacity:0;transform:scale(.82);pointer-events:none;transition-delay:0s}
.bg{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;transition-delay:var(--dl,0s);z-index:-1}
.bg.show{opacity:1}
.bg.S{background:linear-gradient(135deg,#ffd27a,#ff9f1c 40%,#ff6a00)}
.bg.M{background:linear-gradient(135deg,#ff6fb0,#ff2e88 45%,#b5179e)}
.bg.V{background:linear-gradient(135deg,#a78bfa,#7c3aed 45%,#4c1d95)}
.bg.X{background:linear-gradient(125deg,#ffb547,#ff6a00 25%,#ff2e88 58%,#7c3aed)}
.bg.G{background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.035));box-shadow:inset 0 0 0 1px rgba(255,255,255,.13)}
.bg.K{background:linear-gradient(160deg,#1d1030,#120a1f);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.bg.C{background:linear-gradient(160deg,#fff7ec,#ffe9d2)}
.bg.W{background:#fff}
.bg.grad{background-size:180% 180%;animation:flow 14s ease-in-out infinite alternate}
@keyframes flow{from{background-position:0% 20%}to{background-position:100% 80%}}
.bg.grad::after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.26) 50%,transparent 58%);transform:translateX(-70%);animation:sheen 9s ease-in-out infinite;animation-delay:var(--sd,0s)}
@keyframes sheen{0%,72%{transform:translateX(-70%)}100%{transform:translateX(70%)}}

/* content layers cross-fade when a tile changes what it shows */
.c{position:absolute;left:0;top:0;padding:28px 30px;display:flex;flex-direction:column;opacity:0;transition:opacity .45s ease .3s}
.c.in{opacity:1}
.c.out{opacity:0;transition:opacity .3s ease 0s}
.c.d{color:#24100a}
.c.d .dim{color:rgba(36,16,10,.72)}
.dim{color:var(--dim)}
.up{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .8s var(--spring);transition-delay:calc(.35s + var(--i,0)*.07s)}
.c.in .up{opacity:1;transform:none}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.12em;margin-bottom:-.12em}
.w>span{display:inline-block;transform:translateY(108%);transition:transform .95s var(--spring);transition-delay:calc(.3s + var(--i)*.055s)}
.c.in .w>span{transform:none}
.gt .w>span{background:linear-gradient(90deg,#ffc15e,#ff7a00 30%,#ff4d9d 65%,#b794ff);background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gt 6s ease-in-out infinite alternate}
/* on a gradient tile the emphasis is a deep plum instead of a gradient */
.c.g .gt .w>span{background:none;color:#2b0820;animation:none}
@keyframes gt{from{background-position:0 0}to{background-position:100% 0}}

/* type */
.ey{font:700 13px/1 var(--font-b);letter-spacing:.24em;text-transform:uppercase;opacity:.85}
.c.d .ey{opacity:.75}
.hx{font:800 70px/1.02 var(--font-h);letter-spacing:-.035em}
.h2{font:800 46px/1.05 var(--font-h);letter-spacing:-.03em}
.h3{font:800 30px/1.1 var(--font-h);letter-spacing:-.02em}
.h4{font:700 21px/1.18 var(--font-h);letter-spacing:-.01em}
.p{font-size:18px;line-height:1.5}
.ps{font-size:16px;line-height:1.45}
.num{font:800 104px/.9 var(--font-h);letter-spacing:-.05em}
.num.xl{font-size:132px}
.hi{font-family:var(--font-hi);font-weight:700}
.mt-a{margin-top:auto}
.row{display:flex;align-items:center;gap:12px}
.ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.14);flex:none}
.c.d .ico{background:rgba(36,16,10,.1)}
.ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip2{font:600 13.5px/1 var(--font-b);padding:8px 12px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);white-space:nowrap}
.big .chip2{font-size:18px;padding:11px 16px}
.c.d .chip2{background:rgba(36,16,10,.09);border-color:rgba(36,16,10,.12)}
.pop{opacity:0;transform:scale(.6);transition:opacity .45s ease,transform .6s cubic-bezier(.2,1.5,.4,1);transition-delay:calc(.5s + var(--i,0)*.05s)}
.c.in .pop{opacity:1;transform:none}

/* tile kinds */
.logo{display:grid;place-items:center;height:100%}.logo img{max-width:78%;max-height:70%}
.scr{position:absolute;left:50%;top:50%;width:1040px;height:650px;display:flex;align-items:center;justify-content:center;
  transform:translate(-50%,-50%) perspective(1800px) rotateY(var(--ry,-14deg)) rotateX(6deg) translateY(40px) scale(calc(var(--k)*.92));opacity:0;
  transition:transform 1.3s var(--spring) .35s,opacity .6s ease .35s}
.c.in .scr{transform:translate(-50%,-50%) perspective(1800px) rotateY(var(--rz,-3deg)) rotateX(2deg) scale(var(--k));opacity:1}
.scr .win{box-shadow:0 30px 80px -20px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.2)}
.visbox{width:640px;height:400px;transform-origin:top left}
.mq{overflow:hidden;white-space:nowrap;margin:0 -30px;mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mq span{display:inline-block;font:800 40px/1.25 var(--font-h);letter-spacing:-.02em;animation:mq 26s linear infinite;padding-right:0}
.mq.r span{animation-direction:reverse;opacity:.6}
@keyframes mq{to{transform:translateX(-50%)}}
.place{display:flex;align-items:center;gap:12px;font:700 22px/1.2 var(--font-h);padding:11px 0;border-top:1px solid rgba(255,255,255,.12)}
.place:first-child{border-top:0}
.place i{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,#ffb547,#ff2e88);box-shadow:0 0 0 5px rgba(255,46,136,.18)}
.demo{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:99px;font:700 15px/1 var(--font-b);background:linear-gradient(120deg,#ffb547,#ff6a00 45%,#ff2e88);color:#1b0710}
.demo.off{background:rgba(255,255,255,.1);color:var(--dim)}
.rail{justify-content:center;gap:6px;padding:18px 20px}
.rail .k{font:700 12px/1 var(--font-b);letter-spacing:.18em;opacity:.7}
.rail .n{font:700 17px/1.15 var(--font-h)}
.rail .lv{font:700 11px/1 var(--font-b);letter-spacing:.1em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;opacity:.85}
.rail .lv::before{content:"";width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.25)}
.qrw{display:grid;place-items:center;height:100%;gap:12px;align-content:center;color:#24100a}
.qrw .qrbox{width:268px;height:268px}.qrw svg{width:100%;height:100%;display:block}
.qrw span{font:700 15px var(--font-b)}
.ct{display:grid;gap:4px}
.ct a,.ct div{display:flex;align-items:center;gap:16px;padding:12px 0;border-top:1px solid rgba(255,255,255,.1)}
.ct a:first-child{border-top:0}
.ct small{display:block;font:700 12px/1 var(--font-b);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.ct b{font:700 25px/1.1 var(--font-h);letter-spacing:-.01em}
.bigno{font:800 64px/1 var(--font-h);letter-spacing:-.04em;opacity:.9}

/* ---------- controls ---------- */
#hud{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px;border-radius:99px;background:rgba(18,10,30,.72);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:10;transition:opacity .5s ease;font:600 14px var(--font-b)}
#hud button{all:unset;cursor:pointer;padding:9px 14px;border-radius:99px;color:var(--ink)}
#hud button:hover,#hud button:focus-visible{background:rgba(255,255,255,.12)}
#hud .lbl{padding:0 10px;min-width:12rem;text-align:center;color:var(--dim)}
#hud .lbl b{color:var(--ink)}
#hud #auto.on{background:linear-gradient(120deg,#ff9f1c,#ff2e88);color:#1b0710}
#bar{position:fixed;left:0;bottom:0;height:3px;width:100%;transform-origin:left;transform:scaleX(var(--p,0));background:linear-gradient(90deg,#ff9f1c,#ff2e88,#7c3aed);transition:transform .8s var(--ease);z-index:10}
.idle #hud{opacity:0;pointer-events:none}
.record #hud,.record #bar{display:none}
#turn{display:none}
@media (orientation:portrait) and (max-width:760px){
  #turn{display:grid;place-items:center;position:fixed;inset:auto 12px 80px;padding:14px 18px;border-radius:16px;background:rgba(18,10,30,.9);border:1px solid rgba(255,255,255,.16);z-index:11;font:600 15px var(--font-b);text-align:center}
  #turn.gone{display:none}
}

/* still: every scene in its finished state (screenshots) */
.still *,.still *::before,.still *::after{transition:none!important;animation-delay:0s!important;animation-duration:1ms!important;animation-iteration-count:1!important}
@media (prefers-reduced-motion:reduce){.bx,.bg,.c,.up,.w>span,.scr,.pop{transition-duration:.01ms!important;transition-delay:0s!important}.mq span,.bg.grad,.bg.grad::after,.blob i,.gt .w>span{animation:none!important}}

  clearTimeout(timer);
  if (mode !== 'loop' || paused) return;
  timer = setTimeout(() => { if (pos === FLAT.length - 1) { if (!RECORD) show(0); } else show(pos + 1); }, FLAT[pos].st.dur);
}
function setMode(m) { mode = m; paused = false; $('#auto').classList.toggle('on', m === 'loop'); $('#auto').setAttribute('aria-pressed', m === 'loop'); schedule(); }
function fromHash() {
  const m = /^#([a-z]+)(?:-(\d+))?$/.exec(location.hash || '');
  if (!m) return 0;
  const si = SCENES.findIndex(s => s.id === m[1]);
  if (si < 0) return 0;
  const k = Math.min(SCENES[si].steps.length - 1, Math.max(0, (+m[2] || 1) - 1));
  return FLAT.findIndex(f => f.si === si && f.k === k);
}

/* ---------- input ---------- */
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); prev(); }
  else if (k === 'Home') show(0);
  else if (k === 'End') show(FLAT.length - 1);
  else if (k === 'f' || k === 'F') toggleFs();
  else if (k === 'a' || k === 'A') setMode(mode === 'loop' ? 'present' : 'loop');
});
function toggleFs() { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.().catch(() => {}); }
$('#next').onclick = next; $('#prev').onclick = prev; $('#fs').onclick = toggleFs;
$('#auto').onclick = () => setMode(mode === 'loop' ? 'present' : 'loop');
$('#turn').onclick = (e) => e.currentTarget.classList.add('gone');
stage.addEventListener('click', (e) => {
  if (e.target.closest('a')) return;
  if (mode === 'loop') { paused = !paused; schedule(); } else next();
});
let tx = null;
addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; }, { passive: true });
addEventListener('touchend', (e) => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) (dx < 0 ? next : prev)(); tx = null; });
let idle;
const wake = () => { document.body.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => document.body.classList.add('idle'), 3000); };
addEventListener('mousemove', wake); addEventListener('touchstart', wake, { passive: true }); wake();

/* ---------- fit the board to the screen ---------- */
const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / BW, innerHeight / BH).toFixed(4));
addEventListener('resize', fit); fit();

/* ---------- start ---------- */
window.__deck = { show, next, prev, setMode, get pos() { return pos; }, FLAT, SCENES };
window.__loopSeconds = FLAT.reduce((a, f) => a + f.st.dur, 0) / 1000;
document.fonts.ready.then(() => {
  const start = RECORD ? 0 : fromHash();
  if (RECORD || Q.get('mode') === 'loop') mode = 'loop';
  setMode(mode);
  if (STILL) show(start, true);
  else setTimeout(() => show(start), RECORD ? 200 : 120);
});
</script>
</body>
