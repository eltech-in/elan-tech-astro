<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <div id="scenes"></div>
  <div class="wipe"></div>
  <div class="flash"></div>
  <div class="grain"></div>
  <div class="fade"></div>
</div>
<script>
const Q = new URLSearchParams(location.search);
const W = +Q.get('w') || 1920, H = +Q.get('h') || 1080, V = H > W, U = Math.min(W, H) / 100;
const DUR = 93.5, BEAT = 0.5;
const stage = document.getElementById('stage');
Object.assign(stage.style, { width: W + 'px', height: H + 'px' });
document.documentElement.style.setProperty('--u', U + 'px');
if (V) stage.classList.add('v');

/* ---------- maths ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eo5 = (x) => 1 - Math.pow(1 - x, 5);
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const c1 = 1.6, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
const rng = (s) => () => { s |= 0; s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const inRanges = (t, rs) => rs.some(([a, b]) => t >= a && t < b);

/* ---------- background: sky, nebulae, stars, light beams ---------- */
const cv = document.getElementById('bg'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
const R = rng(42);
const stars = Array.from({ length: Math.round((W * H) / 6500) }, () => ({ x: R() * W, y: R() * H, r: 0.35 + R() * 1.25, p: R() * 6.28, s: 0.2 + R() * 0.8 }));
const GROOVE = [[6, 30], [38, 70], [74, 84]];
function beamDraw(x, y, ang, wid, I) {
  if (I <= 0.01) return;
  g.save(); g.translate(x, y); g.rotate(ang);
  const gr = g.createLinearGradient(0, -wid / 2, 0, wid / 2);
  gr.addColorStop(0, 'rgba(99,102,241,0)'); gr.addColorStop(0.36, `rgba(129,140,248,${0.22 * I})`);
  gr.addColorStop(0.5, `rgba(224,231,255,${0.7 * I})`); gr.addColorStop(0.64, `rgba(129,140,248,${0.22 * I})`); gr.addColorStop(1, 'rgba(99,102,241,0)');
  g.fillStyle = gr; g.fillRect(-wid, -wid / 2, Math.hypot(W, H) * 2, wid);
  g.restore();
  const fl = g.createRadialGradient(x, y, 0, x, y, wid * 1.6);
  fl.addColorStop(0, `rgba(238,240,255,${0.55 * I})`); fl.addColorStop(1, 'rgba(129,140,248,0)');
  g.fillStyle = fl; g.beginPath(); g.arc(x, y, wid * 1.6, 0, 6.29); g.fill();
}
function drawBg(t) {
  g.globalCompositeOperation = 'source-over'; g.filter = 'none';
  const sky = g.createRadialGradient(W * 0.5, -H * 0.15, 0, W * 0.5, -H * 0.15, Math.max(W, H) * 1.25);
  sky.addColorStop(0, '#151852'); sky.addColorStop(0.32, '#0a0b2c'); sky.addColorStop(0.75, '#04050f');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  const intro = eo(seg(t, 0, 2.5)), outro = 1 - seg(t, DUR - 1.4, DUR);
  // nebulae
  g.globalCompositeOperation = 'lighter';
  [[0.78, 0.2, '99,102,241', 0.13, 0.13], [0.2, 0.85, '139,92,246', 0.1, 0.11], [0.55, 0.6, '236,72,153', 0.045, 0.07]].forEach(([nx, ny, c, a, sp], i) => {
    const x = W * (nx + 0.06 * Math.sin(t * sp + i)), y = H * (ny + 0.05 * Math.cos(t * sp * 1.3 + i)), r = Math.max(W, H) * 0.55;

      const last = vis[vis.length - 1]; dot.setAttribute('cx', last[0]); dot.setAttribute('cy', last[1]); dot.style.opacity = p > 0 ? 1 : 0;
      cvv.textContent = '+' + Math.round(p * 184) + '%';
    };
  });
}

{

/* ---------- compositor ---------- */
const wipe = document.querySelector('.wipe'), flash = document.querySelector('.flash'), fade = document.querySelector('.fade');
const CUTS = SCENES.slice(1).map((s) => s.start);
const IMPACTS = [6, 38, 84];
function render(t) {
  drawBg(t);
  for (const s of SCENES) {
    const dur = s.end - s.start, lt = t - s.start;
    const vis = t >= s.start - 0.05 && t < s.end + 0.35;
    s.el.style.display = vis ? 'flex' : 'none';
    if (!vis) continue;
    const inP = s.start === 0 ? 1 : eo(seg(t, s.start - 0.02, s.start + 0.3)), outP = s.end >= DUR ? 0 : seg(t, s.end - 0.32, s.end);
    s.el.style.opacity = inP * (1 - outP);
    s.el.style.transform = `scale(${(1 + 0.03 * clamp(lt / dur)) * (1 - 0.04 * outP) * (s.start ? lerp(1.05, 1, inP) : 1)})`;
    s.render(clamp(lt, 0, dur + 0.35), t);
  }
  // light-band wipe across each cut
  let wp = -1; for (const c of CUTS) if (t > c - 0.4 && t < c + 0.4) wp = (t - (c - 0.4)) / 0.8;
  wipe.style.opacity = wp < 0 ? 0 : Math.sin(wp * Math.PI) * 0.9; wipe.style.left = lerp(-0.35 * W, 1.1 * W, eio(clamp(wp))) + 'px';
  let fl = 0; for (const i of IMPACTS) if (t >= i) fl = Math.max(fl, 0.55 * Math.exp(-(t - i) * 5));
  flash.style.opacity = fl;
  fade.style.opacity = Math.max(1 - seg(t, 0, 0.6), seg(t, DUR - 1.2, DUR));
}
window.__render = render;
window.__duration = DUR;
window.__ready = Promise.all([document.fonts.ready, ...[...document.images].map((im) => (im.complete ? 1 : new Promise((r) => { im.onload = im.onerror = r; })))]).then(() => { render(0); return true; });
window.__ready.then(() => {
  if (Q.has('t')) render(+Q.get('t'));
  if (Q.has('play')) { const t0 = performance.now(); const loop = () => { const t = (performance.now() - t0) / 1000; render(t % DUR); requestAnimationFrame(loop); }; loop(); }
});
</script>
