# Builds, checks and deploys elan-tech.net to Hostinger whenever main changes.
# Same steps as `npm run deploy` (scripts/deploy.sh), run by GitHub instead of a laptop.
#
# One-time setup (GitHub repo → Settings → Secrets and variables → Actions → New repository secret):
#   HOSTINGER_SSH_PRIVATE_KEY  the private half of a key made only for deploys (~/.ssh/hostinger_deploy on
#                              the owner's Mac); its public half is added in hPanel → Advanced → SSH Access
# The server address, port and username below are not secret. Override them, or the folder, with
# repository variables (same page, "Variables" tab) if the hosting changes:
#   HOSTINGER_SSH_HOST (82.112.232.47) · HOSTINGER_SSH_PORT (65002) · HOSTINGER_SSH_USER (u881024201)
#   HOSTINGER_REMOTE_PATH (domains/elan-tech.net/public_html; ~/public_html is a link to it)
#
# The build only uploads after every build check and audit passes. The server-only lead-alert
# configuration lives outside public_html (~/elan-tech-private) and is never touched.
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Deploy even during the 6–12 December 2026 trip freeze'
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://elan-tech.net/
    steps:
      # No automatic deploys while the owner is travelling (6–12 December 2026, India time).
      # A manual run with "force" ticked still deploys. Delete this step after the trip.
      - name: Check the deploy freeze
        id: freeze
        run: |
          today=$(TZ=Asia/Kolkata date +%Y%m%d)
          if [ "$today" -ge 20261206 ] && [ "$today" -le 20261212 ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "Deploy freeze (6–12 December 2026). Run the workflow manually with 'force' to deploy anyway."
            echo "frozen=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.freeze.outputs.frozen != 'true'

      - uses: actions/setup-node@v4
        if: steps.freeze.outputs.frozen != 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install
        if: steps.freeze.outputs.frozen != 'true'
        run: npm ci

      - name: Build
        if: steps.freeze.outputs.frozen != 'true'
        run: npm run build

      - name: Check the build (205 checks and audits)
        if: steps.freeze.outputs.frozen != 'true'
        run: npm run verify

      - name: Prepare SSH
        if: steps.freeze.outputs.frozen != 'true'
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
        # The server's public host keys, checked on 2026-11-16 against the fingerprints shown in
        # hPanel (ED25519 SHA256:nz6XFdcgHdJySLhQZZTajHXcfJxEI7doTGGxp6j4n/c). Pinning them means the
        # upload refuses to run against any other machine. Update these lines if Hostinger moves the site.
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/known_hosts <<'KEYS'
          [82.112.232.47]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJ0bgY4WRLNoMa8o/BgK58W3ZDgiLAgIfk+WqdQhVyiN
          [82.112.232.47]:65002 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBIs4L83AW1VG9KFFjpcTauw/sxzxFxwIDzLjO7B9SSQGkAUYxNLEHnB35sGFhvbWWXT3jB+HXKZauO2xMauuQbQ=
          KEYS
          sed -i 's/^ *//' ~/.ssh/known_hosts

      - name: Upload dist/ to Hostinger
        if: steps.freeze.outputs.frozen != 'true'
        env:
          SSH_HOST: ${{ vars.HOSTINGER_SSH_HOST || '82.112.232.47' }}
          SSH_PORT: ${{ vars.HOSTINGER_SSH_PORT || '65002' }}
          SSH_USER: ${{ vars.HOSTINGER_SSH_USER || 'u881024201' }}
          REMOTE_PATH: ${{ vars.HOSTINGER_REMOTE_PATH || 'domains/elan-tech.net/public_html' }}
        # --delete removes files that are no longer part of the site (for example the old /dubai/ folder).
        # .well-known/ is kept for SSL certificate checks.
        run: |
          rsync -az --delete --stats \
            --exclude='.well-known/' \
            -e "ssh -p ${SSH_PORT:-65002} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            dist/ "${SSH_USER}@${SSH_HOST}:${REMOTE_PATH}/"

      - name: Check the live site
        if: steps.freeze.outputs.frozen != 'true'
        # Hostinger's CDN can serve old pages for a few minutes; a failure here does not undo the upload.
        continue-on-error: true
        run: npm run verify:live
